name: IndexNow

# Vercel reports each production deploy to GitHub; once it is live,
# tell Bing (and the other IndexNow engines) to recrawl the sitemap.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
